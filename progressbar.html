<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h2>basic progress bar</h2>
        <p>to create a default progress bar , add a .program class to a container element and add the progress bar class
            to its child element. use the css width property to set width of the progress bar :
        </p>
        <div class="progress">
            <div class="progress-bar" style="width:70%"> 70%</div>
        </div>
    </div>
</body>
</html>
